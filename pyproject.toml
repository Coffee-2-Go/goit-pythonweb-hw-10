[tool.poetry]
name = "goit-pythonweb-hw-10"
version = "0.1.0"
description = ""
authors = ["Coffe-2-Go"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.14,<4.0"
asyncpg = ">=0.30.0,<1.0.0"
sqlalchemy = ">=2.0.36,<3.0.0"
alembic = ">=1.14.0,<2.0.0"
greenlet = ">=3.1.1,<4.0.0"
fastapi = { extras = ["standard"], version = ">=0.115.5,<1.0.0" }
uvicorn = { extras = ["standard"], version = ">=0.34.0,<1.0.0" }
pydantic-settings = ">=2.6.1,<3.0.0"
slowapi = "^0.1.9"
cloudinary = ">=1.41.0,<2.0.0"
PyJWT = ">=2.10.1,<3.0.0"
fastapi-mail = ">=1.4.2,<2.0.0"
libgravatar = ">=1.0.4,<2.0.0"
pwdlib = { extras = ["argon2"], version = ">=0.2.1,<1.0.0" }


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
